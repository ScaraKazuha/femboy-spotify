[package]
name = "femboy-spotify"
version = "0.1.0"
edition = "2024"
description = "A cute pink terminal Spotify client"
license = "MIT"
repository = "https://github.com/ScaraKazuha/femboy-spotify"
readme = "README.md"
keywords = ["spotify", "tui", "music", "player", "femboy"]

[dependencies]
anyhow = "1.0.105"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
fastrand = "2.5.0"
futures-util = "0.3.34"
librespot = { version = "0.8.0", default-features = false, features = ["rodio-backend", "rustls-tls-native-roots"] }
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

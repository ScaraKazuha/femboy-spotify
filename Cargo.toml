[package]
name = "femboy-spotify"
version = "0.4.0"
edition = "2024"
description = "A cute pink Spotify client written in Rust"
license = "MIT"
repository = "https://github.com/ScaraKazuha/femboy-spotify"
readme = "README.md"
default-run = "femboy-spotify"
keywords = ["spotify", "tui", "gui", "music", "player", "femboy"]

[lib]
name = "femboy_spotify"
path = "src/lib.rs"

[[bin]]
name = "femboy-spotify"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
fastrand = "2.5.0"
futures-util = "0.3.34"
librespot = { version = "0.8.0", default-features = false, features = ["rodio-backend", "rustls-tls-native-roots"] }
log = "0.4.35"
protobuf = "3.7"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["custom-protocol"] }
tauri-plugin-updater = "2"
tokio = { version = "1.54.1", features = ["full"] }

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }
